spring:
  application:
    name: khmer_market
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:marketplace}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 15
      minimum-idle: 5
      idle-timeout: 300000
      max-lifetime: 1200000
      connection-timeout: 20000
  jpa:
    open-in-view: true
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration
  mvc:
    throw-exception-if-no-handler-found: true
    locale: km
    locale-resolver: fixed
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 15MB

server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

# Khmer Market Specific Custom Configurations
market:
  security:
    secret-key: ${APP_SECRET_KEY:9a4b8c7d6e5f1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a6b}
    webhook-secret: ${PAYMENT_WEBHOOK_SECRET:8f7e6d5c4b3a2f1e0d9c8b7a6f5e4d3c2b1a0f9e8d7c6b5a4f3e2d1c0b9a8f7e}
    admin-allowed-ips: ${ADMIN_ALLOWED_IPS:}
    lockout:
      max-failed-attempts: 5
      lock-duration-minutes: 15
    password-reset:
      token-validity-minutes: 30
  rate-limit:
    login:
      capacity: 5
      refill-tokens: 5
      refill-period-seconds: 60
    admin-login:
      capacity: 5
      refill-tokens: 5
      refill-period-seconds: 60
    register:
      capacity: 5
      refill-tokens: 5
      refill-period-seconds: 3600
    forgot-password:
      capacity: 3
      refill-tokens: 3
      refill-period-seconds: 3600
    checkout:
      capacity: 10
      refill-tokens: 10
      refill-period-seconds: 60
    cart-ajax:
      capacity: 60
      refill-tokens: 60
      refill-period-seconds: 60
    review-submit:
      capacity: 10
      refill-tokens: 10
      refill-period-seconds: 3600
    file-upload:
      capacity: 20
      refill-tokens: 20
      refill-period-seconds: 3600
    admin-console:
      capacity: 120
      refill-tokens: 120
      refill-period-seconds: 60
    public-get:
      capacity: 300
      refill-tokens: 300
      refill-period-seconds: 60
  storage:
    upload-dir: ${UPLOAD_DIR:uploads}
    max-product-images: 5
  business:
    exchange-rate-usd-khr: ${EXCHANGE_RATE_USD_KHR:4100}
    shipping-flat-rate: ${SHIPPING_FLAT_RATE_USD:1.50}
    shipping-free-threshold: ${SHIPPING_FREE_THRESHOLD_USD:25.00}
    order-reservation-timeout-minutes: ${ORDER_RESERVATION_TIMEOUT_MINUTES:30}
    mail-from: ${MAIL_FROM:no-reply@khmermarket.gov.kh}
