<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" th:lang="${#locale.language}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="_csrf" th:content="${_csrf != null ? _csrf.token : ''}">
    <meta name="_csrf_header" th:content="${_csrf != null ? _csrf.headerName : ''}">
    <title th:text="#{favorites.title} + ' - ' + #{app.name}">My Favorites - Khmer Marketplace</title>
    <link rel="stylesheet" th:href="@{/css/kantumruy-pro.css}">
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/bootstrap-icons.min.css}">
    <link rel="stylesheet" th:href="@{/css/storefront.css}">
</head>
<body>
    <div th:replace="~{layout/navbar :: navbar}"></div>

    <main class="container py-4">
        <!-- Breadcrumb -->
        <nav aria-label="breadcrumb" class="mb-3">
            <ol class="breadcrumb small">
                <li class="breadcrumb-item"><a th:href="@{/}" class="text-decoration-none text-muted" th:text="#{nav.home}">Home</a></li>
                <li class="breadcrumb-item active text-success fw-bold" aria-current="page" th:text="#{favorites.title}">Favorites</li>
            </ol>
        </nav>

        <h1 class="fw-bold fs-2 text-dark mb-4 d-flex align-items-center gap-2">
            <i class="bi bi-heart-fill text-danger"></i>
            <span th:text="#{favorites.title}">My Favorite Products</span>
        </h1>

        <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-4" th:if="${favorites != null and !favorites.isEmpty()}">
            <div class="col" th:each="fav : ${favorites.content}">
                <div class="km-card">
                    <div class="km-product-img-wrap">
                        <img th:if="${fav.primaryImageUrl != null}" th:src="@{/uploads/{img}(img=${fav.primaryImageUrl})}" th:alt="${fav.name}" class="km-product-img">
                        <div th:unless="${fav.primaryImageUrl != null}" class="km-product-placeholder">
                            <i class="bi bi-tree"></i>
                        </div>
                        <button type="button" class="km-fav-btn active" th:data-product-id="${fav.id}" title="Remove from Favorites">
                            <i class="bi bi-heart-fill"></i>
                        </button>
                    </div>

                    <div class="km-card-body">
                        <div class="km-product-category" th:text="${fav.categoryName}">Category</div>
                        <a th:href="@{/products/{id}(id=${fav.id})}" class="km-product-title" th:text="${fav.name}">Product Name</a>

                        <div class="km-seller-details">
                            <a th:if="${fav.sellerId != null}" th:href="@{/farmers/{id}(id=${fav.sellerId})}" class="km-seller-tag" title="Visit Farm">
                                <i class="bi bi-shop text-success"></i>
                                <span class="fw-semibold" th:text="${fav.sellerFarmName != null ? fav.sellerFarmName : 'Direct Farm'}">Farm Name</span>
                                <span th:if="${fav.province != null}" class="text-muted small">(&lrm;<span th:text="${fav.province}"></span>)</span>
                            </a>
                            <div class="km-seller-user" title="Seller" th:if="${fav.sellerName != null or fav.sellerUsername != null}">
                                <i class="bi bi-person text-muted"></i>
                                <span>Sold by:</span>
                                <strong th:text="${fav.sellerName != null ? fav.sellerName : fav.sellerUsername}">Farmer Name</strong>
                                <span class="text-muted small" th:if="${fav.sellerUsername != null and (fav.sellerName == null or !fav.sellerName.equalsIgnoreCase(fav.sellerUsername))}" th:text="'(@' + ${fav.sellerUsername} + ')'">(@user)</span>
                            </div>
                        </div>

                        <div class="mt-auto d-flex justify-content-between align-items-center pt-2 border-top">
                            <div>
                                <span class="small text-muted d-block">From</span>
                                <span class="km-price-tag">$<span th:text="${fav.minPrice}">10.00</span></span>
                            </div>
                            <a th:href="@{/products/{id}(id=${fav.id})}" class="km-btn-primary py-2 px-3">
                                <i class="bi bi-eye"></i> <span th:text="#{catalog.select_package}">View</span>
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="text-center py-5 bg-white rounded-4 border shadow-sm my-4" th:if="${favorites == null or favorites.isEmpty()}">
            <i class="bi bi-heartbreak display-1 text-muted"></i>
            <h4 class="fw-bold mt-3 text-dark" th:text="#{favorites.empty}">No favorite items saved yet.</h4>
            <p class="text-secondary small">Click the heart icon on any product in the catalog to save it here for later.</p>
            <a th:href="@{/products}" class="km-btn-primary mt-2">
                <i class="bi bi-basket2"></i> <span th:text="#{cart.start_shopping}">Browse Products</span>
            </a>
        </div>
    </main>

    <div th:replace="~{layout/footer :: footer}"></div>

    <script th:src="@{/js/bootstrap.bundle.min.js}"></script>
    <script th:src="@{/js/favorites.js}"></script>
</body>
</html>
