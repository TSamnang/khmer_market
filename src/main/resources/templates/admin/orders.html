<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Oversight - Khmer Market Admin</title>
    <link rel="stylesheet" th:href="@{/css/kantumruy-pro.css}">
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/bootstrap-icons.min.css}">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body class="admin-body">
<div class="admin-wrapper">
    <div th:replace="~{admin/fragments/sidebar :: sidebar}"></div>

    <div class="admin-canvas">
        <div th:replace="~{admin/fragments/topbar :: topbar('Marketplace Order Oversight')}"></div>

        <div class="admin-content">
            <!-- Flash Alerts -->
            <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
                <i class="bi bi-check-circle me-2"></i><span th:text="${successMessage}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
                <i class="bi bi-exclamation-triangle me-2"></i><span th:text="${errorMessage}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <!-- Filters -->
            <div class="admin-card mb-4">
                <div class="admin-card-body">
                    <form th:action="@{/admin/orders}" method="get" class="row g-2 align-items-center">
                        <div class="col-12 col-md-5">
                            <div class="input-group">
                                <span class="input-group-text bg-white border-end-0"><i class="bi bi-search text-muted"></i></span>
                                <input type="text" name="query" class="form-control border-start-0" placeholder="Search order number or buyer..." th:value="${query}">
                            </div>
                        </div>
                        <div class="col-6 col-md-4">
                            <select name="status" class="form-select">
                                <option value="">All Order Statuses</option>
                                <option th:each="s : ${statuses}" th:value="${s}" th:text="${s}" th:selected="${selectedStatus == s}"></option>
                            </select>
                        </div>
                        <div class="col-6 col-md-3 d-flex gap-2">
                            <button type="submit" class="btn btn-admin-primary flex-grow-1">Filter</button>
                            <a th:href="@{/admin/orders}" class="btn btn-admin-outline" title="Reset Filters"><i class="bi bi-arrow-counterclockwise"></i></a>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Orders Table -->
            <div class="admin-card">
                <div class="admin-card-header">
                    <h2 class="admin-card-title">Customer Orders (<span th:text="${totalElements}">0</span>)</h2>
                </div>
                <div class="admin-card-body p-0">
                    <div class="table-responsive">
                        <table class="admin-table">
                            <thead>
                                <tr>
                                    <th>Order #</th>
                                    <th>Buyer Customer</th>
                                    <th>Fulfilling Farmer</th>
                                    <th>Date Placed</th>
                                    <th>Order Total</th>
                                    <th>Status</th>
                                    <th class="text-end">Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:if="${orders.empty}">
                                    <td colspan="7" class="text-center text-muted py-4">No orders found matching criteria.</td>
                                </tr>
                                <tr th:each="o : ${orders}">
                                    <td>
                                        <a th:href="@{/admin/orders/{id}(id=${o.id})}" class="font-monospace fw-bold text-decoration-none text-primary" th:text="${o.orderNumber}">KM-20261015-ABCD</a>
                                    </td>
                                    <td>
                                        <div class="fw-semibold" th:text="${o.buyer.fullName}">Customer Name</div>
                                        <div class="small text-muted" th:text="${o.buyer.username}">buyer1</div>
                                    </td>
                                    <td>
                                        <span class="badge bg-light text-dark border" th:text="${o.seller.farmerProfile != null ? o.seller.farmerProfile.farmName : o.seller.username}">Farm</span>
                                    </td>
                                    <td class="small text-muted" th:text="${#temporals.format(o.createdAt, 'yyyy-MM-dd HH:mm')}">2026-10-15 14:00</td>
                                    <td>
                                        <strong th:text="'$' + ${#numbers.formatDecimal(o.totalAmount, 1, 'COMMA', 2, 'POINT')}">$25.00</strong>
                                    </td>
                                    <td>
                                        <span class="admin-badge" th:classappend="'admin-badge-' + ${#strings.toLowerCase(o.status.name())}" th:text="${o.status}">CONFIRMED</span>
                                    </td>
                                    <td class="text-end">
                                        <a th:href="@{/admin/orders/{id}(id=${o.id})}" class="btn btn-sm btn-admin-outline">
                                            <i class="bi bi-eye me-1"></i>Inspect
                                        </a>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- Pagination -->
                <div class="admin-card-footer p-3 border-top d-flex justify-content-between align-items-center" th:if="${totalPages > 1}">
                    <div class="small text-muted">
                        Page <span th:text="${currentPage + 1}">1</span> of <span th:text="${totalPages}">1</span>
                    </div>
                    <ul class="pagination pagination-sm m-0">
                        <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled' : ''">
                            <a class="page-link" th:href="@{/admin/orders(page=${currentPage - 1}, query=${query}, status=${selectedStatus})}">Previous</a>
                        </li>
                        <li class="page-item" th:classappend="${currentPage + 1 == totalPages} ? 'disabled' : ''">
                            <a class="page-link" th:href="@{/admin/orders(page=${currentPage + 1}, query=${query}, status=${selectedStatus})}">Next</a>
                        </li>
                    </ul>
                </div>
            </div>

        </div>
    </div>
</div>
<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
