<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Category - Khmer Market Admin</title>
    <link rel="stylesheet" th:href="@{/css/kantumruy-pro.css}">
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/bootstrap-icons.min.css}">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body class="admin-body">
<div class="admin-wrapper">
    <div th:replace="~{admin/fragments/sidebar :: sidebar}"></div>

    <div class="admin-canvas">
        <div th:replace="~{admin/fragments/topbar :: topbar('Edit Category')}"></div>

        <div class="admin-content">
            <div class="d-flex align-items-center justify-content-between mb-4">
                <a th:href="@{/admin/categories}" class="btn btn-sm btn-admin-outline">
                    <i class="bi bi-arrow-left me-1"></i>Back to Categories
                </a>
            </div>

            <div class="row justify-content-center">
                <div class="col-12 col-md-8 col-lg-6">
                    <div class="admin-card">
                        <div class="admin-card-header">
                            <h2 class="admin-card-title"><i class="bi bi-pencil-square text-primary me-2"></i>Edit Category Details</h2>
                        </div>
                        <div class="admin-card-body">
                            <form th:action="@{/admin/categories/{id}/edit(id=${category.id})}" th:object="${categoryForm}" method="post" enctype="multipart/form-data">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                                <div class="mb-3">
                                    <label class="form-label small fw-bold">Category Name <span class="text-danger">*</span></label>
                                    <input type="text" th:field="*{name}" class="form-control" required>
                                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label small fw-bold">Description</label>
                                    <textarea th:field="*{description}" class="form-control" rows="4"></textarea>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label small fw-bold">Current Banner Image</label>
                                    <div class="mb-2" th:if="${category.imageUrl != null && !category.imageUrl.isEmpty()}">
                                        <img th:src="@{/uploads/{img}(img=${category.imageUrl})}" alt="Category banner" class="rounded border object-fit-cover" width="120" height="80">
                                    </div>
                                    <div class="small text-muted mb-2" th:unless="${category.imageUrl != null && !category.imageUrl.isEmpty()}">
                                        No image currently uploaded.
                                    </div>
                                    <label class="form-label small fw-bold">Replace Banner (Optional)</label>
                                    <input type="file" name="image" class="form-control form-control-sm" accept="image/jpeg,image/png,image/webp">
                                </div>

                                <div class="d-flex gap-2">
                                    <button type="submit" class="btn btn-admin-primary flex-grow-1">Save Changes</button>
                                    <a th:href="@{/admin/categories}" class="btn btn-admin-outline">Cancel</a>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>
<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
