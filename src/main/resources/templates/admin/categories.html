<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Category Management - Khmer Market Admin</title>
    <link rel="stylesheet" th:href="@{/css/kantumruy-pro.css}">
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/bootstrap-icons.min.css}">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body class="admin-body">
<div class="admin-wrapper">
    <div th:replace="~{admin/fragments/sidebar :: sidebar}"></div>

    <div class="admin-canvas">
        <div th:replace="~{admin/fragments/topbar :: topbar('Category Management')}"></div>

        <div class="admin-content">
            <!-- Flash Alerts -->
            <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
                <i class="bi bi-check-circle me-2"></i><span th:text="${successMessage}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
                <i class="bi bi-exclamation-triangle me-2"></i><span th:text="${errorMessage}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <div class="row g-4">
                <!-- Left: Category List -->
                <div class="col-12 col-lg-8">
                    <div class="admin-card">
                        <div class="admin-card-header">
                            <h2 class="admin-card-title">Marketplace Categories (<span th:text="${#lists.size(categories)}">0</span>)</h2>
                        </div>
                        <div class="admin-card-body p-0">
                            <div class="table-responsive">
                                <table class="admin-table">
                                    <thead>
                                        <tr>
                                            <th>Image</th>
                                            <th>Category Name</th>
                                            <th>Description</th>
                                            <th>Products Count</th>
                                            <th class="text-end">Actions</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr th:if="${#lists.isEmpty(categories)}">
                                            <td colspan="5" class="text-center text-muted py-4">No categories created yet.</td>
                                        </tr>
                                        <tr th:each="cat : ${categories}">
                                            <td style="width: 60px;">
                                                <img th:if="${cat.imageUrl != null && !cat.imageUrl.isEmpty()}" 
                                                     th:src="@{/uploads/{img}(img=${cat.imageUrl})}" 
                                                     alt="Cat" class="rounded object-fit-cover" width="40" height="40">
                                                <div th:unless="${cat.imageUrl != null && !cat.imageUrl.isEmpty()}" 
                                                     class="rounded bg-light d-flex align-items-center justify-content-center text-muted" style="width: 40px; height: 40px;">
                                                    <i class="bi bi-tag"></i>
                                                </div>
                                            </td>
                                            <td>
                                                <strong th:text="${cat.name}">Vegetables</strong>
                                            </td>
                                            <td class="small text-muted text-truncate" style="max-width: 250px;" th:text="${cat.description}">Fresh seasonal produce</td>
                                            <td>
                                                <span class="badge bg-light text-dark border" th:text="${productCounts.get(cat.id)} + ' products'">0 products</span>
                                            </td>
                                            <td class="text-end">
                                                <div class="d-inline-flex gap-1">
                                                    <a th:href="@{/admin/categories/{id}/edit(id=${cat.id})}" class="btn btn-sm btn-admin-outline" title="Edit Category">
                                                        <i class="bi bi-pencil"></i>
                                                    </a>
                                                    <form th:if="${productCounts.get(cat.id) == 0}" th:action="@{/admin/categories/{id}/delete(id=${cat.id})}" method="post" class="d-inline m-0">
                                                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                                        <button type="submit" class="btn btn-sm btn-outline-danger" title="Delete Category" onclick="return confirm('Are you sure you want to delete this category?')">
                                                            <i class="bi bi-trash"></i>
                                                        </button>
                                                    </form>
                                                    <span th:if="${productCounts.get(cat.id) > 0}" class="d-inline-block" tabindex="0" title="Cannot delete: contains active products">
                                                        <button class="btn btn-sm btn-outline-secondary" disabled><i class="bi bi-trash"></i></button>
                                                    </span>
                                                </div>
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Right: Create Category Form -->
                <div class="col-12 col-lg-4">
                    <div class="admin-card">
                        <div class="admin-card-header">
                            <h2 class="admin-card-title"><i class="bi bi-plus-circle text-primary me-2"></i>Add New Category</h2>
                        </div>
                        <div class="admin-card-body">
                            <form th:action="@{/admin/categories}" th:object="${categoryForm}" method="post" enctype="multipart/form-data">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                                <div class="mb-3">
                                    <label class="form-label small fw-bold">Category Name <span class="text-danger">*</span></label>
                                    <input type="text" th:field="*{name}" class="form-control form-control-sm" placeholder="e.g., Organic Rice & Grains" required>
                                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label small fw-bold">Description</label>
                                    <textarea th:field="*{description}" class="form-control form-control-sm" rows="3" placeholder="Category summary for buyers..."></textarea>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label small fw-bold">Category Banner Image</label>
                                    <input type="file" name="image" class="form-control form-control-sm" accept="image/jpeg,image/png,image/webp">
                                    <div class="form-text small">Accepted formats: JPG, PNG, WebP (max 5MB).</div>
                                </div>

                                <button type="submit" class="btn btn-admin-primary w-100">
                                    <i class="bi bi-check2 me-1"></i>Save Category
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>
<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
