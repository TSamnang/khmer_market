<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management - Khmer Market Admin</title>
    <link rel="stylesheet" th:href="@{/css/kantumruy-pro.css}">
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/bootstrap-icons.min.css}">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body class="admin-body">
<div class="admin-wrapper">
    <div th:replace="~{admin/fragments/sidebar :: sidebar}"></div>

    <div class="admin-canvas">
        <div th:replace="~{admin/fragments/topbar :: topbar('User Management')}"></div>

        <div class="admin-content">
            <!-- Search & Filters Card -->
            <div class="admin-card mb-4">
                <div class="admin-card-body">
                    <form th:action="@{/admin/users}" method="get" class="row g-2 align-items-center">
                        <div class="col-12 col-md-4">
                            <div class="input-group">
                                <span class="input-group-text bg-white border-end-0"><i class="bi bi-search text-muted"></i></span>
                                <input type="text" name="query" class="form-control border-start-0" placeholder="Search name, phone, email, username..." th:value="${query}">
                            </div>
                        </div>
                        <div class="col-6 col-md-3">
                            <select name="role" class="form-select">
                                <option value="">All Roles</option>
                                <option th:each="r : ${roles}" th:value="${r}" th:text="${r}" th:selected="${selectedRole == r}"></option>
                            </select>
                        </div>
                        <div class="col-6 col-md-3">
                            <select name="status" class="form-select">
                                <option value="">All Statuses</option>
                                <option th:each="s : ${statuses}" th:value="${s}" th:text="${s}" th:selected="${selectedStatus == s}"></option>
                            </select>
                        </div>
                        <div class="col-12 col-md-2 d-flex gap-2">
                            <button type="submit" class="btn btn-admin-primary flex-grow-1">Filter</button>
                            <a th:href="@{/admin/users}" class="btn btn-admin-outline" title="Reset Filters"><i class="bi bi-arrow-counterclockwise"></i></a>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Users Table Card -->
            <div class="admin-card">
                <div class="admin-card-header">
                    <h2 class="admin-card-title">Registered Accounts (<span th:text="${totalElements}">0</span>)</h2>
                </div>
                <div class="admin-card-body p-0">
                    <div class="table-responsive">
                        <table class="admin-table">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Username</th>
                                    <th>Full Name</th>
                                    <th>Contact</th>
                                    <th>Role</th>
                                    <th>Status</th>
                                    <th>Security State</th>
                                    <th class="text-end">Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:if="${users.empty}">
                                    <td colspan="8" class="text-center text-muted py-4">No users found matching current filters.</td>
                                </tr>
                                <tr th:each="u : ${users}">
                                    <td class="font-monospace text-secondary" th:text="'#' + ${u.id}">#1</td>
                                    <td>
                                        <strong th:text="${u.username}">john_doe</strong>
                                    </td>
                                    <td th:text="${u.fullName}">John Doe</td>
                                    <td>
                                        <div class="small" th:text="${u.email}">john@example.com</div>
                                        <div class="small text-muted" th:text="${u.phone != null ? u.phone : 'No phone'}">+855 12 345 678</div>
                                    </td>
                                    <td>
                                        <span class="badge" th:classappend="${u.role.name() == 'ADMIN' ? 'bg-danger' : (u.role.name() == 'FARMER' ? 'bg-success' : 'bg-primary')}" th:text="${u.role}">BUYER</span>
                                    </td>
                                    <td>
                                        <span class="admin-badge" th:classappend="'admin-badge-' + ${#strings.toLowerCase(u.status.name())}" th:text="${u.status}">ACTIVE</span>
                                    </td>
                                    <td>
                                        <div th:if="${u.isAccountLocked()}" class="badge bg-danger">
                                            <i class="bi bi-lock-fill me-1"></i>Locked
                                        </div>
                                        <div th:unless="${u.isAccountLocked()}" class="small text-muted">
                                            <span th:text="${u.failedAttempts}">0</span> failed attempts
                                        </div>
                                    </td>
                                    <td class="text-end">
                                        <a th:href="@{/admin/users/{id}(id=${u.id})}" class="btn btn-sm btn-admin-outline">
                                            <i class="bi bi-eye me-1"></i>Details
                                        </a>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
                <!-- Pagination -->
                <div class="admin-card-footer p-3 border-top d-flex justify-content-between align-items-center" th:if="${totalPages > 1}">
                    <div class="small text-muted">
                        Page <span th:text="${currentPage + 1}">1</span> of <span th:text="${totalPages}">1</span>
                    </div>
                    <ul class="pagination pagination-sm m-0">
                        <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled' : ''">
                            <a class="page-link" th:href="@{/admin/users(page=${currentPage - 1}, query=${query}, role=${selectedRole}, status=${selectedStatus})}">Previous</a>
                        </li>
                        <li class="page-item" th:classappend="${currentPage + 1 == totalPages} ? 'disabled' : ''">
                            <a class="page-link" th:href="@{/admin/users(page=${currentPage + 1}, query=${query}, role=${selectedRole}, status=${selectedStatus})}">Next</a>
                        </li>
                    </ul>
                </div>
            </div>

        </div>
    </div>
</div>
<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
