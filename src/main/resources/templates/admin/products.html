<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Moderation - Khmer Market Admin</title>
    <link rel="stylesheet" th:href="@{/css/kantumruy-pro.css}">
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/bootstrap-icons.min.css}">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body class="admin-body">
<div class="admin-wrapper">
    <div th:replace="~{admin/fragments/sidebar :: sidebar}"></div>

    <div class="admin-canvas">
        <div th:replace="~{admin/fragments/topbar :: topbar('Product Moderation')}"></div>

        <div class="admin-content">
            <!-- Flash Alerts -->
            <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
                <i class="bi bi-check-circle me-2"></i><span th:text="${successMessage}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
                <i class="bi bi-exclamation-triangle me-2"></i><span th:text="${errorMessage}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <!-- Filters -->
            <div class="admin-card mb-4">
                <div class="admin-card-body">
                    <form th:action="@{/admin/products}" method="get" class="row g-2 align-items-center">
                        <div class="col-12 col-md-4">
                            <div class="input-group">
                                <span class="input-group-text bg-white border-end-0"><i class="bi bi-search text-muted"></i></span>
                                <input type="text" name="query" class="form-control border-start-0" placeholder="Search product name or seller..." th:value="${query}">
                            </div>
                        </div>
                        <div class="col-6 col-md-3">
                            <select name="categoryId" class="form-select">
                                <option value="">All Categories</option>
                                <option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}" th:selected="${selectedCategoryId == c.id}"></option>
                            </select>
                        </div>
                        <div class="col-6 col-md-3">
                            <select name="status" class="form-select">
                                <option value="">All Statuses</option>
                                <option th:each="s : ${statuses}" th:value="${s}" th:text="${s}" th:selected="${selectedStatus == s}"></option>
                            </select>
                        </div>
                        <div class="col-12 col-md-2 d-flex gap-2">
                            <button type="submit" class="btn btn-admin-primary flex-grow-1">Filter</button>
                            <a th:href="@{/admin/products}" class="btn btn-admin-outline" title="Reset Filters"><i class="bi bi-arrow-counterclockwise"></i></a>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Products Table -->
            <div class="admin-card">
                <div class="admin-card-header">
                    <h2 class="admin-card-title">Products Catalog (<span th:text="${totalElements}">0</span>)</h2>
                </div>
                <div class="admin-card-body p-0">
                    <div class="table-responsive">
                        <table class="admin-table">
                            <thead>
                                <tr>
                                    <th>Product</th>
                                    <th>Seller Farm</th>
                                    <th>Category</th>
                                    <th>Packages & Pricing</th>
                                    <th>Status</th>
                                    <th>Created Date</th>
                                    <th class="text-end">Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:if="${products.empty}">
                                    <td colspan="7" class="text-center text-muted py-4">No products found matching criteria.</td>
                                </tr>
                                <tr th:each="p : ${products}">
                                    <td>
                                        <div class="d-flex align-items-center gap-2">
                                            <img th:if="${p.primaryImage != null}" th:src="@{/uploads/{img}(img=${p.primaryImage.imageUrl})}" alt="Thumb" class="rounded object-fit-cover" width="40" height="40">
                                            <div th:unless="${p.primaryImage != null}" class="rounded bg-light d-flex align-items-center justify-content-center text-muted" style="width: 40px; height: 40px;">
                                                <i class="bi bi-image"></i>
                                            </div>
                                            <div>
                                                <strong th:text="${p.name}">Organic Jasmine Rice</strong>
                                                <div class="small text-muted font-monospace" th:text="'#' + ${p.id}">#10</div>
                                            </div>
                                        </div>
                                    </td>
                                    <td>
                                        <div class="fw-semibold" th:text="${p.seller.farmerProfile != null ? p.seller.farmerProfile.farmName : p.seller.fullName}">Battambang Farm</div>
                                        <div class="small text-muted" th:text="${p.seller.username}">username</div>
                                    </td>
                                    <td>
                                        <span class="badge bg-light text-dark border" th:text="${p.category.name}">Grains</span>
                                    </td>
                                    <td>
                                        <span class="small" th:text="${#lists.size(p.packages)} + ' package tiers'">1 package</span>
                                    </td>
                                    <td>
                                        <span class="admin-badge" th:classappend="'admin-badge-' + ${#strings.toLowerCase(p.status.name())}" th:text="${p.status}">ACTIVE</span>
                                    </td>
                                    <td class="small text-muted" th:text="${#temporals.format(p.createdAt, 'yyyy-MM-dd')}">2026-10-12</td>
                                    <td class="text-end">
                                        <div class="admin-actions">
                                            <a th:href="@{/admin/products/{id}(id=${p.id})}" class="btn-admin-action btn-admin-action-view" title="Inspect Product">
                                                <i class="bi bi-eye"></i> View
                                            </a>
                                            <!-- Toggle Status Button -->
                                            <form th:if="${p.status.name() == 'ACTIVE'}" th:action="@{/admin/products/{id}/status(id=${p.id})}" method="post">
                                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                                <input type="hidden" name="status" value="INACTIVE" />
                                                <button type="submit" class="btn-admin-action btn-admin-action-reject" title="Force Deactivate">
                                                    <i class="bi bi-slash-circle"></i> Deactivate
                                                </button>
                                            </form>
                                            <form th:unless="${p.status.name() == 'ACTIVE'}" th:action="@{/admin/products/{id}/status(id=${p.id})}" method="post">
                                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                                <input type="hidden" name="status" value="ACTIVE" />
                                                <button type="submit" class="btn-admin-action btn-admin-action-approve" title="Activate">
                                                    <i class="bi bi-check-circle"></i> Activate
                                                </button>
                                            </form>
                                        </div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- Pagination -->
                <div class="admin-card-footer p-3 border-top d-flex justify-content-between align-items-center" th:if="${totalPages > 1}">
                    <div class="small text-muted">
                        Page <span th:text="${currentPage + 1}">1</span> of <span th:text="${totalPages}">1</span>
                    </div>
                    <ul class="pagination pagination-sm m-0">
                        <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled' : ''">
                            <a class="page-link" th:href="@{/admin/products(page=${currentPage - 1}, query=${query}, categoryId=${selectedCategoryId}, status=${selectedStatus})}">Previous</a>
                        </li>
                        <li class="page-item" th:classappend="${currentPage + 1 == totalPages} ? 'disabled' : ''">
                            <a class="page-link" th:href="@{/admin/products(page=${currentPage + 1}, query=${query}, categoryId=${selectedCategoryId}, status=${selectedStatus})}">Next</a>
                        </li>
                    </ul>
                </div>
            </div>

        </div>
    </div>
</div>
<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
