<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Review Moderation - Khmer Market Admin</title>
    <link rel="stylesheet" th:href="@{/css/kantumruy-pro.css}">
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/bootstrap-icons.min.css}">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body class="admin-body">
<div class="admin-wrapper">
    <div th:replace="~{admin/fragments/sidebar :: sidebar}"></div>

    <div class="admin-canvas">
        <div th:replace="~{admin/fragments/topbar :: topbar('Review Moderation')}"></div>

        <div class="admin-content">
            <!-- Flash Alerts -->
            <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
                <i class="bi bi-check-circle me-2"></i><span th:text="${successMessage}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
                <i class="bi bi-exclamation-triangle me-2"></i><span th:text="${errorMessage}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <!-- Filters -->
            <div class="admin-card mb-4">
                <div class="admin-card-body">
                    <form th:action="@{/admin/reviews}" method="get" class="row g-2 align-items-center">
                        <div class="col-12 col-md-5">
                            <div class="input-group">
                                <span class="input-group-text bg-white border-end-0"><i class="bi bi-search text-muted"></i></span>
                                <input type="text" name="query" class="form-control border-start-0" placeholder="Search comment, product, or author..." th:value="${query}">
                            </div>
                        </div>
                        <div class="col-6 col-md-2">
                            <select name="rating" class="form-select">
                                <option value="">All Ratings</option>
                                <option value="5" th:selected="${selectedRating == 5}">5 Stars</option>
                                <option value="4" th:selected="${selectedRating == 4}">4 Stars</option>
                                <option value="3" th:selected="${selectedRating == 3}">3 Stars</option>
                                <option value="2" th:selected="${selectedRating == 2}">2 Stars</option>
                                <option value="1" th:selected="${selectedRating == 1}">1 Star</option>
                            </select>
                        </div>
                        <div class="col-6 col-md-2">
                            <select name="status" class="form-select">
                                <option value="">All Statuses</option>
                                <option th:each="s : ${statuses}" th:value="${s}" th:text="${s}" th:selected="${selectedStatus == s}"></option>
                            </select>
                        </div>
                        <div class="col-12 col-md-3 d-flex gap-2">
                            <button type="submit" class="btn btn-admin-primary flex-grow-1">Filter</button>
                            <a th:href="@{/admin/reviews}" class="btn btn-admin-outline" title="Reset Filters"><i class="bi bi-arrow-counterclockwise"></i></a>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Reviews Table -->
            <div class="admin-card">
                <div class="admin-card-header">
                    <h2 class="admin-card-title">Customer Reviews (<span th:text="${totalElements}">0</span>)</h2>
                </div>
                <div class="admin-card-body p-0">
                    <div class="table-responsive">
                        <table class="admin-table">
                            <thead>
                                <tr>
                                    <th>Product</th>
                                    <th>Author</th>
                                    <th>Rating</th>
                                    <th>Review Content</th>
                                    <th>Status</th>
                                    <th>Date</th>
                                    <th class="text-end">Moderation</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:if="${reviews.empty}">
                                    <td colspan="7" class="text-center text-muted py-4">No reviews found matching criteria.</td>
                                </tr>
                                <tr th:each="r : ${reviews}">
                                    <td>
                                        <a th:href="@{/admin/products/{id}(id=${r.product.id})}" class="fw-semibold text-decoration-none text-dark" th:text="${r.product.name}">Product Name</a>
                                    </td>
                                    <td>
                                        <div class="small fw-semibold" th:text="${r.user.fullName}">Customer</div>
                                        <div class="small text-muted" th:text="${r.user.username}">username</div>
                                    </td>
                                    <td>
                                        <div>
                                            <span th:if="${r.rating != null and r.rating > 0}" th:each="i : ${#numbers.sequence(1, r.rating)}"><i class="bi bi-star-fill text-warning"></i></span><span th:if="${r.rating != null and r.rating < 5}" th:each="i : ${#numbers.sequence(1, 5 - r.rating)}"><i class="bi bi-star text-muted"></i></span>
                                        </div>
                                    </td>
                                    <td class="small" style="max-width: 300px;">
                                        <div th:text="${r.comment}">Review text comment...</div>
                                    </td>
                                    <td>
                                        <span class="admin-badge" th:classappend="'admin-badge-' + ${#strings.toLowerCase(r.status.name())}" th:text="${r.status}">PUBLISHED</span>
                                    </td>
                                    <td class="small text-muted" th:text="${#temporals.format(r.createdAt, 'yyyy-MM-dd')}">2026-10-15</td>
                                    <td class="text-end">
                                        <div class="d-inline-flex gap-1">
                                            <!-- Publish/Approve if not published -->
                                            <form th:if="${r.status.name() != 'PUBLISHED'}" th:action="@{/admin/reviews/{id}/status(id=${r.id})}" method="post" class="d-inline m-0">
                                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                                <input type="hidden" name="status" value="PUBLISHED" />
                                                <button type="submit" class="btn btn-sm btn-outline-success" title="Approve / Publish">
                                                    <i class="bi bi-check-circle"></i>
                                                </button>
                                            </form>
                                            <!-- Hide if published -->
                                            <form th:if="${r.status.name() == 'PUBLISHED'}" th:action="@{/admin/reviews/{id}/status(id=${r.id})}" method="post" class="d-inline m-0">
                                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                                <input type="hidden" name="status" value="HIDDEN" />
                                                <button type="submit" class="btn btn-sm btn-outline-warning" title="Hide Review">
                                                    <i class="bi bi-eye-slash"></i>
                                                </button>
                                            </form>
                                            <!-- Delete permanently -->
                                            <form th:action="@{/admin/reviews/{id}/delete(id=${r.id})}" method="post" class="d-inline m-0">
                                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                                <button type="submit" class="btn btn-sm btn-outline-danger" title="Permanently Delete" onclick="return confirm('Permanently delete this review?')">
                                                    <i class="bi bi-trash"></i>
                                                </button>
                                            </form>
                                        </div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- Pagination -->
                <div class="admin-card-footer p-3 border-top d-flex justify-content-between align-items-center" th:if="${totalPages > 1}">
                    <div class="small text-muted">
                        Page <span th:text="${currentPage + 1}">1</span> of <span th:text="${totalPages}">1</span>
                    </div>
                    <ul class="pagination pagination-sm m-0">
                        <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled' : ''">
                            <a class="page-link" th:href="@{/admin/reviews(page=${currentPage - 1}, query=${query}, rating=${selectedRating}, status=${selectedStatus})}">Previous</a>
                        </li>
                        <li class="page-item" th:classappend="${currentPage + 1 == totalPages} ? 'disabled' : ''">
                            <a class="page-link" th:href="@{/admin/reviews(page=${currentPage + 1}, query=${query}, rating=${selectedRating}, status=${selectedStatus})}">Next</a>
                        </li>
                    </ul>
                </div>
            </div>

        </div>
    </div>
</div>
<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
