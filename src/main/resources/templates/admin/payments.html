<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Audit Log - Khmer Market Admin</title>
    <link rel="stylesheet" th:href="@{/css/kantumruy-pro.css}">
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/bootstrap-icons.min.css}">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body class="admin-body">
<div class="admin-wrapper">
    <div th:replace="~{admin/fragments/sidebar :: sidebar}"></div>

    <div class="admin-canvas">
        <div th:replace="~{admin/fragments/topbar :: topbar('Payment Audit Log')}"></div>

        <div class="admin-content">
            <!-- Filters -->
            <div class="admin-card mb-4">
                <div class="admin-card-body">
                    <form th:action="@{/admin/payments}" method="get" class="row g-2 align-items-center">
                        <div class="col-12 col-md-5">
                            <div class="input-group">
                                <span class="input-group-text bg-white border-end-0"><i class="bi bi-search text-muted"></i></span>
                                <input type="text" name="query" class="form-control border-start-0" placeholder="Search transaction ID or order #..." th:value="${query}">
                            </div>
                        </div>
                        <div class="col-6 col-md-2">
                            <select name="method" class="form-select">
                                <option value="">All Methods</option>
                                <option th:each="m : ${methods}" th:value="${m}" th:text="${m}" th:selected="${selectedMethod == m}"></option>
                            </select>
                        </div>
                        <div class="col-6 col-md-2">
                            <select name="status" class="form-select">
                                <option value="">All Statuses</option>
                                <option th:each="s : ${statuses}" th:value="${s}" th:text="${s}" th:selected="${selectedStatus == s}"></option>
                            </select>
                        </div>
                        <div class="col-12 col-md-3 d-flex gap-2">
                            <button type="submit" class="btn btn-admin-primary flex-grow-1">Filter</button>
                            <a th:href="@{/admin/payments}" class="btn btn-admin-outline" title="Reset Filters"><i class="bi bi-arrow-counterclockwise"></i></a>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Payments Table -->
            <div class="admin-card">
                <div class="admin-card-header">
                    <h2 class="admin-card-title">Payment Transactions (<span th:text="${totalElements}">0</span>)</h2>
                </div>
                <div class="admin-card-body p-0">
                    <div class="table-responsive">
                        <table class="admin-table">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Transaction ID</th>
                                    <th>Order #</th>
                                    <th>Method</th>
                                    <th>Amount</th>
                                    <th>Status</th>
                                    <th>Date</th>
                                    <th class="text-end">Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:if="${payments.empty}">
                                    <td colspan="8" class="text-center text-muted py-4">No payment transactions found matching criteria.</td>
                                </tr>
                                <tr th:each="p : ${payments}">
                                    <td class="font-monospace text-secondary" th:text="'#' + ${p.id}">#1</td>
                                    <td>
                                        <span class="font-monospace fw-semibold" th:text="${p.transactionId != null ? p.transactionId : 'N/A'}">TX-10023</span>
                                    </td>
                                    <td>
                                        <a th:href="@{/admin/orders/{id}(id=${p.order.id})}" class="font-monospace text-decoration-none fw-bold text-primary" th:text="${p.order.orderNumber}">KM-100</a>
                                    </td>
                                    <td>
                                        <span class="badge bg-light text-dark border" th:text="${p.paymentMethod}">KHQR</span>
                                    </td>
                                    <td>
                                        <strong th:text="'$' + ${#numbers.formatDecimal(p.amount, 1, 'COMMA', 2, 'POINT')}">$10.00</strong>
                                    </td>
                                    <td>
                                        <span class="admin-badge" th:classappend="'admin-badge-' + ${#strings.toLowerCase(p.paymentStatus.name())}" th:text="${p.paymentStatus}">PAID</span>
                                    </td>
                                    <td class="small text-muted" th:text="${p.paymentDate != null ? #temporals.format(p.paymentDate, 'yyyy-MM-dd HH:mm') : (p.createdAt != null ? #temporals.format(p.createdAt, 'yyyy-MM-dd HH:mm') : 'N/A')}">2026-10-15</td>
                                    <td class="text-end">
                                        <a th:href="@{/admin/payments/{id}(id=${p.id})}" class="btn btn-sm btn-admin-outline">
                                            <i class="bi bi-eye me-1"></i>Audit
                                        </a>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- Pagination -->
                <div class="admin-card-footer p-3 border-top d-flex justify-content-between align-items-center" th:if="${totalPages > 1}">
                    <div class="small text-muted">
                        Page <span th:text="${currentPage + 1}">1</span> of <span th:text="${totalPages}">1</span>
                    </div>
                    <ul class="pagination pagination-sm m-0">
                        <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled' : ''">
                            <a class="page-link" th:href="@{/admin/payments(page=${currentPage - 1}, query=${query}, method=${selectedMethod}, status=${selectedStatus})}">Previous</a>
                        </li>
                        <li class="page-item" th:classappend="${currentPage + 1 == totalPages} ? 'disabled' : ''">
                            <a class="page-link" th:href="@{/admin/payments(page=${currentPage + 1}, query=${query}, method=${selectedMethod}, status=${selectedStatus})}">Next</a>
                        </li>
                    </ul>
                </div>
            </div>

        </div>
    </div>
</div>
<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
