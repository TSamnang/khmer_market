<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{app.name} + ' - Error'">Khmer Marketplace - Error</title>
    <link rel="stylesheet" th:href="@{/css/kantumruy-pro.css}">
    <link rel="stylesheet" th:href="@{/css/error.css}">
</head>
<body>
    <div class="error-card">
        <div class="error-badge error-badge-404">
            <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="12" y1="8" x2="12" y2="12"></line>
                <line x1="12" y1="16" x2="12.01" y2="16"></line>
            </svg>
        </div>
        <h1 class="error-title" th:text="#{error.500.heading}">Error</h1>
        <p class="error-description" th:text="${errorMessage != null ? errorMessage : #messages.msg('error.500.message')}">An error occurred.</p>
        <div>
            <a th:href="@{/}" class="btn-primary" th:text="#{error.500.back_home}">Back to Home</a>
        </div>
    </div>
</body>
</html>
