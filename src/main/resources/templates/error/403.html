<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{error.403.title} + ' - ' + #{app.name}">403 Forbidden - Khmer Marketplace</title>
    <link rel="stylesheet" th:href="@{/css/kantumruy-pro.css}">
    <link rel="stylesheet" th:href="@{/css/error.css}">
</head>
<body>
    <div class="error-card">
        <div class="error-badge error-badge-403">
            <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
        </div>
        <div class="error-code" style="color: #d97706;">HTTP 403</div>
        <h1 class="error-title" th:text="#{error.403.heading}">403 - Access Denied</h1>
        <p class="error-description">
            <span th:if="${isCsrfError}" th:text="#{error.403.csrf_message}">Your session or form has expired. Please reload and try again.</span>
            <span th:unless="${isCsrfError}" th:text="#{error.403.message}">You do not have permission to access this resource.</span>
        </p>
        <div>
            <a th:href="@{/}" class="btn-primary" th:text="#{error.403.back_home}">Back to Home</a>
        </div>
    </div>
</body>
</html>
