<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{auth.forgot.title} + ' - ' + #{app.name}">Forgot Password - Khmer Marketplace</title>
    <link rel="stylesheet" th:href="@{/css/kantumruy-pro.css}">
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body>
    <header class="auth-header">
        <a th:href="@{/}" class="auth-logo">
            <div class="auth-logo-badge">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"></path>
                    <path d="M3 6h18"></path>
                    <path d="M16 10a4 4 0 0 1-8 0"></path>
                </svg>
            </div>
            <span th:text="#{app.name}">Khmer Marketplace</span>
        </a>
        <div>
            <a th:if="${#locale.language == 'km'}" th:href="@{/forgot-password(lang='en')}" class="lang-switch-btn">English</a>
            <a th:if="${#locale.language != 'km'}" th:href="@{/forgot-password(lang='km')}" class="lang-switch-btn">ភាសាខ្មែរ</a>
        </div>
    </header>

    <main class="auth-container">
        <div class="auth-card">
            <h1 class="auth-title" th:text="#{auth.forgot.title}">Forgot Password</h1>
            <p class="auth-subtitle" th:text="#{auth.forgot.subtitle}">Enter your email to receive a password reset link</p>

            <div th:if="${emailSent}" class="alert-box alert-success">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
                <span th:text="#{auth.forgot.success}">If an account exists with this email, a reset link has been dispatched.</span>
            </div>

            <form th:unless="${emailSent}" th:action="@{/forgot-password}" th:object="${forgotPasswordDto}" method="post">
                <div class="form-group">
                    <label for="email" class="form-label" th:text="#{auth.forgot.email}">Registered Email</label>
                    <input type="email" id="email" th:field="*{email}" class="form-input" required autofocus autocomplete="email">
                    <div th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="form-error"></div>
                </div>

                <button type="submit" class="btn-submit" th:text="#{auth.forgot.submit}">Send Reset Link</button>
            </form>

            <div class="auth-footer-links">
                <a th:href="@{/login}" th:text="#{auth.forgot.back_to_login}">Back to Sign In</a>
            </div>
        </div>
    </main>
</body>
</html>
