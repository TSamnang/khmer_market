<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{auth.reset.title} + ' - ' + #{app.name}">Reset Password - Khmer Marketplace</title>
    <link rel="stylesheet" th:href="@{/css/kantumruy-pro.css}">
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body>
    <header class="auth-header">
        <a th:href="@{/}" class="auth-logo">
            <div class="auth-logo-badge">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"></path>
                    <path d="M3 6h18"></path>
                    <path d="M16 10a4 4 0 0 1-8 0"></path>
                </svg>
            </div>
            <span th:text="#{app.name}">Khmer Marketplace</span>
        </a>
    </header>

    <main class="auth-container">
        <div class="auth-card">
            <h1 class="auth-title" th:text="#{auth.reset.title}">Set New Password</h1>
            <p class="auth-subtitle" th:text="#{auth.reset.subtitle}">Enter your new secure password (minimum 12 characters)</p>

            <div th:if="${invalidToken}" class="alert-box alert-danger">
                <span th:text="#{auth.reset.invalid_token}">This reset link is invalid or has expired.</span>
            </div>

            <div th:if="${errorMessage}" class="alert-box alert-danger">
                <span th:text="${errorMessage}">Error occurred</span>
            </div>

            <form th:unless="${invalidToken}" th:action="@{/reset-password}" th:object="${resetPasswordDto}" method="post">
                <input type="hidden" th:field="*{token}">

                <div class="form-group">
                    <label for="reset-password" class="form-label" th:text="#{auth.reset.password}">New Password (min 12 chars)</label>
                    <div class="input-password-wrapper">
                        <input type="password" id="reset-password" th:field="*{password}" class="form-input" required autocomplete="new-password">
                        <button type="button" class="btn-toggle-password" data-target="reset-password" th:attr="data-label-show=#{auth.login.show_password}, data-label-hide=#{auth.login.hide_password}" th:text="#{auth.login.show_password}">Show</button>
                    </div>
                    <div th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="form-error"></div>
                </div>

                <div class="form-group">
                    <label for="reset-confirm-password" class="form-label" th:text="#{auth.reset.confirm_password}">Confirm New Password</label>
                    <div class="input-password-wrapper">
                        <input type="password" id="reset-confirm-password" th:field="*{confirmPassword}" class="form-input" required autocomplete="new-password">
                        <button type="button" class="btn-toggle-password" data-target="reset-confirm-password" th:attr="data-label-show=#{auth.login.show_password}, data-label-hide=#{auth.login.hide_password}" th:text="#{auth.login.show_password}">Show</button>
                    </div>
                    <div th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}" class="form-error"></div>
                </div>

                <button type="submit" class="btn-submit" th:text="#{auth.reset.submit}">Update Password</button>
            </form>

            <div class="auth-footer-links">
                <a th:href="@{/login}" th:text="#{auth.forgot.back_to_login}">Back to Sign In</a>
            </div>
        </div>
    </main>

    <script th:src="@{/js/password-toggle.js}"></script>
</body>
</html>
